name: Bug report
description: Report a problem with opencode-prompt-expand
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include API keys, full prompts, or personal file contents.
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode Desktop version
      placeholder: "2.2.5"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Type ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the toast text and timing (immediate, a few seconds, or about 30 seconds).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact prompts, keys, and personal paths.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I removed keys, tokens, prompts, and personal file contents.
          required: true
