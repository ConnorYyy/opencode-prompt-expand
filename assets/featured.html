<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>opencode-prompt-expand featured image</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Inter", Arial, sans-serif;
    background: #080d19;
    color: #f5f7ff;
    -webkit-font-smoothing: antialiased;
  }
  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    padding: 64px 72px 54px;
    overflow: hidden;
    background:
      radial-gradient(circle at 78% 18%, rgba(70, 130, 255, 0.20), transparent 34%),
      radial-gradient(circle at 18% 78%, rgba(40, 220, 190, 0.13), transparent 32%),
      linear-gradient(145deg, #0a1020 0%, #0b1224 52%, #070b14 100%);
  }
  .canvas::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(140, 170, 230, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 170, 230, 0.045) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 78%);
  }
  .glow {
    position: absolute;
    border-radius: 999px;
    filter: blur(80px);
    opacity: 0.5;
    pointer-events: none;
  }
  .g1 { width: 420px; height: 420px; right: -120px; top: 40px; background: #245bff; }
  .g2 { width: 360px; height: 360px; left: -140px; bottom: 20px; background: #16c7a7; opacity: 0.3; }
  .top {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border: 1px solid rgba(120, 160, 230, 0.28);
    background: rgba(16, 28, 52, 0.72);
    border-radius: 999px;
    font-size: 17px;
    letter-spacing: 2.4px;
    font-weight: 650;
    color: #b9c9e9;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #3ee0be;
    box-shadow: 0 0 18px rgba(62, 224, 190, 0.9);
  }
  .version {
    font-family: Consolas, "Cascadia Code", monospace;
    font-size: 18px;
    color: #7e91b8;
  }
  h1 {
    position: relative;
    z-index: 2;
    margin: 54px 0 0;
    font-size: 86px;
    line-height: 0.98;
    letter-spacing: -3.8px;
    font-weight: 760;
  }
  h1 span {
    color: #67e5ca;
    text-shadow: 0 0 46px rgba(53, 220, 185, 0.24);
  }
  .tagline {
    position: relative;
    z-index: 2;
    margin: 24px 0 0;
    max-width: 820px;
    font-size: 29px;
    line-height: 1.35;
    color: #a9b9d8;
    letter-spacing: -0.3px;
  }
  .flow {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr 104px 1.18fr;
    gap: 12px;
    align-items: center;
    margin-top: 48px;
  }
  .card {
    min-height: 300px;
    border-radius: 26px;
    padding: 26px 26px 22px;
    border: 1px solid rgba(130, 165, 230, 0.22);
    background: linear-gradient(180deg, rgba(24, 38, 68, 0.86), rgba(12, 20, 38, 0.88));
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .card.result {
    border-color: rgba(75, 225, 193, 0.35);
    background: linear-gradient(180deg, rgba(18, 53, 62, 0.62), rgba(10, 26, 35, 0.9));
  }
  .label {
    font-family: Consolas, "Cascadia Code", monospace;
    font-size: 14px;
    letter-spacing: 2.6px;
    color: #8094bb;
    margin-bottom: 20px;
  }
  .result .label { color: #64d9c0; }
  .quote {
    font-size: 31px;
    line-height: 1.32;
    color: #e7edff;
    letter-spacing: -0.5px;
    margin: 8px 0 18px;
  }
  .muted {
    font-size: 17px;
    color: #7386aa;
    line-height: 1.4;
  }
  .rline {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 13px 0;
  }
  .check {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: rgba(58, 221, 187, 0.14);
    border: 1px solid rgba(58, 221, 187, 0.35);
    color: #64e5cb;
    font-size: 15px;
    font-weight: 800;
    flex: none;
  }
  .bar {
    height: 10px;
    border-radius: 99px;
    background: linear-gradient(90deg, rgba(109, 145, 210, 0.75), rgba(109, 145, 210, 0.28));
  }
  .w90 { width: 90%; }
  .w74 { width: 74%; }
  .w82 { width: 82%; }
  .w60 { width: 60%; }
  .w68 { width: 68%; }
  .arrow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .bolt {
    width: 68px;
    height: 68px;
    border-radius: 22px;
    display: grid;
    place-items: center;
    font-size: 36px;
    background: linear-gradient(145deg, #47e3c5, #347dff);
    color: #07111f;
    box-shadow: 0 0 45px rgba(60, 220, 195, 0.28);
  }
  .arrow-line {
    width: 2px;
    height: 58px;
    background: linear-gradient(to bottom, rgba(80, 225, 200, 0.7), rgba(80, 225, 200, 0));
  }
  .footer {
    position: absolute;
    z-index: 2;
    left: 72px;
    right: 72px;
    bottom: 50px;
    display: flex;
    gap: 14px;
    align-items: center;
    font-family: Consolas, "Cascadia Code", monospace;
    font-size: 16px;
    color: #6d82a8;
    letter-spacing: 0.4px;
  }
  .footer span {
    padding: 7px 12px;
    border-radius: 8px;
    background: rgba(20, 34, 60, 0.62);
    border: 1px solid rgba(120, 155, 220, 0.14);
  }
  .footer .accent { color: #67e5ca; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="top">
      <div class="badge"><span class="dot"></span> OPENCODE DESKTOP PLUGIN</div>
      <div class="version">v0.1.0</div>
    </div>

    <h1>opencode-<br /><span>prompt-expand</span></h1>
    <p class="tagline">Turn rough drafts into structured prompts — in place, in your composer.</p>

    <div class="flow">
      <div class="card draft">
        <div class="label">DRAFT</div>
        <div class="quote">“修一下登录的 bug”</div>
        <div class="bar w82" style="margin-bottom:12px"></div>
        <div class="bar w60" style="margin-bottom:22px"></div>
        <div class="muted">vague · missing scope<br />no acceptance criteria</div>
      </div>

      <div class="arrow">
        <div class="bolt">⚡</div>
        <div class="arrow-line"></div>
      </div>

      <div class="card result">
        <div class="label">EXPANDED</div>
        <div class="rline"><span class="check">✓</span><div class="bar w90"></div></div>
        <div class="rline"><span class="check">✓</span><div class="bar w74"></div></div>
        <div class="rline"><span class="check">✓</span><div class="bar w82"></div></div>
        <div class="rline"><span class="check">✓</span><div class="bar w68"></div></div>
        <div class="muted" style="margin-top:18px">goal · scope · constraints<br />output · acceptance</div>
      </div>
    </div>

    <div class="footer">
      <span>MIT licensed</span>
      <span>BYOK</span>
      <span class="accent">never auto-sends</span>
    </div>
  </div>
</body>
</html>
